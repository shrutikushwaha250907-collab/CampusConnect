{% extends "base.html" %}

{% block title %}Add Event{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-body p-5">

                    <h2 class="text-center fw-bold mb-4">

                        📅 Add Campus Event

                    </h2>

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">Event Title</label>

                            <input
                                type="text"
                                name="title"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">Date</label>

                            <input
                                type="date"
                                name="date"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">Location</label>

                            <input
                                type="text"
                                name="location"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">Description</label>

                            <textarea
                                name="description"
                                rows="5"
                                class="form-control"
                                required></textarea>

                        </div>

                        <button class="btn btn-warning btn-lg w-100">

                            Add Event

                        </button>

                    </form>

                    <div class="text-center mt-4">

                        <a href="/events">

                            ← Back to Events

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
