{% extends "base.html" %}

{% block title %}Manage Teachers{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row">

        <div class="col-lg-5">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h4>Add Teacher</h4>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <input
                            class="form-control mb-3"
                            name="fullname"
                            placeholder="Full Name"
                            required>

                        <input
                            class="form-control mb-3"
                            type="email"
                            name="email"
                            placeholder="Email"
                            required>

                        <input
                            class="form-control mb-3"
                            name="username"
                            placeholder="Username"
                            required>

                        <input
                            class="form-control mb-3"
                            type="password"
                            name="password"
                            placeholder="Password"
                            required>

                        <button class="btn btn-primary w-100">

                            Add Teacher

                        </button>

                    </form>

                </div>

            </div>

        </div>

        <div class="col-lg-7">

            <div class="card shadow">

                <div class="card-header bg-success text-white">

                    <h4>Teachers</h4>

                </div>

                <div class="card-body">

                    <table class="table table-bordered">

                        <tr>

                            <th>Name</th>

                            <th>Username</th>

                            <th>Email</th>

                        </tr>

                        {% for teacher in teachers %}

                        <tr>

                            <td>{{ teacher.fullname }}</td>

                            <td>{{ teacher.username }}</td>

                            <td>{{ teacher.email }}</td>

                        </tr>

                        {% endfor %}

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
