{% extends "base.html" %}

{% block title %}Post Announcement{% endblock %}

{% block content %}

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h3>📢 Post Announcement</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label>Title</label>

<input
class="form-control"
name="title"
required>

</div>

<div class="mb-3">

<label>Announcement</label>

<textarea
class="form-control"
rows="6"
name="message"
required></textarea>

</div>

<button class="btn btn-success w-100">

Post Announcement

</button>

</form>

</div>

</div>

</div>

</div>

</div>

{% endblock %}
